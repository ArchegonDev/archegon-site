<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archegon hero — scene lab</title>
<style>
  :root{
    --paper:#f5f1ea; --ink:#101418; --ember:#d66b35;
    --amber:#f0b35a; --line:#d4c9ba;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:#08090c; color:var(--paper);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }

  .hero{
    position:relative;
    width:100%; height:100svh; min-height:600px;
    overflow:hidden; isolation:isolate;
  }
  .scene{ position:absolute; inset:0; z-index:1; }
  .scene canvas{ width:100%; height:100%; display:block; }

  /* copy sits over the cold upper-left, away from the reservoir glow */
  .hero-copy{
    position:relative; z-index:3;
    max-width:760px;
    padding:clamp(28px,6vw,72px);
    padding-top:clamp(80px,14vh,180px);
  }
  .eyebrow{
    color:var(--amber);
    font-size:12px; font-weight:700;
    letter-spacing:.16em; text-transform:uppercase;
    margin-bottom:18px;
  }
  h1{
    font-size:clamp(38px,6.2vw,82px);
    line-height:1.02; font-weight:800;
    letter-spacing:-.022em;
    margin-bottom:22px;
  }
  .lede{
    font-size:clamp(15px,1.5vw,19px);
    line-height:1.55; max-width:56ch;
    color:rgba(245,241,234,.76);
  }
  .actions{ display:flex; gap:12px; margin-top:32px; flex-wrap:wrap; }
  .btn{
    display:inline-flex; align-items:center;
    padding:13px 22px; border-radius:7px;
    font-size:15px; font-weight:600;
    text-decoration:none; cursor:pointer; border:1px solid transparent;
  }
  .btn.primary{ background:var(--ember); color:#fff; }
  .btn.secondary{ border-color:rgba(245,241,234,.28); color:var(--paper); }

  /* lab controls */
  .panel{
    position:fixed; right:14px; bottom:14px; z-index:20;
    display:flex; gap:8px; flex-wrap:wrap;
    background:rgba(8,9,12,.82); padding:10px;
    border:1px solid rgba(245,241,234,.14); border-radius:9px;
    backdrop-filter:blur(10px);
  }
  .panel button{
    font:inherit; font-size:12px; cursor:pointer;
    padding:7px 11px; border-radius:6px;
    background:transparent; color:var(--paper);
    border:1px solid rgba(245,241,234,.24);
  }
  .panel button:hover{ background:rgba(245,241,234,.09); }
</style>
</head>
<body>

<section class="hero">
  <div class="scene" id="scene"></div>

  <div class="hero-copy">
    <p class="eyebrow">Firm clean power x AI compute</p>
    <h1>Bringing compute to the heat</h1>
    <p class="lede">
      Archegon develops geothermal-powered data centres — pairing 24/7 firm clean
      power with AI inference, where the grid cannot reach and intermittent
      renewables cannot follow.
    </p>
    <div class="actions">
      <a class="btn primary" href="#">See the thesis</a>
      <a class="btn secondary" href="#">Get in touch</a>
    </div>
  </div>
</section>

<div class="panel">
  <button id="pulse">Circulation pulse</button>
  <button id="reload">Regrow reservoir</button>
</div>

<script src="lib/three.min.js"></script>
<script src="scene-core.js"></script>
<script src="scene-shaders.js"></script>
<script src="scene-build.js"></script>
<script src="scene-surface.js"></script>
<script src="scene-main.js"></script>
<script>
  ArchegonScene.mount(document.getElementById('scene'));
  document.getElementById('pulse').onclick = function(){ ArchegonScene.pulse(); };
  document.getElementById('reload').onclick = function(){ location.reload(); };
</script>
</body>
</html>
