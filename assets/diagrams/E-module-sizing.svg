<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 950" width="800" height="950" font-family="Inter, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Sizing modules to the power block</title><desc id="d">Four rows of modules: base case all four lit with zero margin; wells 20% low still all four lit because 8 MWe exceeds the 6.94 MW plant; one producer out leaves 5 MW and three modules lit; a hot day (20% illustrative derate) with one producer out leaves 4.0 MW and two modules lit.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="800" height="950" fill="#ffffff"/>
<text x="32" y="48" font-size="26" font-weight="700" fill="#1d2433">Sizing modules to the power block</text>
<text x="32" y="74" font-size="15" fill="#5f6670">Archegon · illustrative concept, not to scale · not an engineering design</text>
<text x="32" y="110.0" font-size="17" font-weight="700" fill="#1d2433" text-anchor="start">Base case</text><text x="32" y="132.0" font-size="13.5" font-weight="400" fill="#5f6670" text-anchor="start">Average supply 6.25 MW = 4 modules × 1.56 MW draw. Zero margin: any derate sheds a module.</text><rect x="32" y="144" width="662.8242074927954" height="24" rx="6" fill="#e8a33d" stroke="none" stroke-width="2"/><text x="40" y="161.0" font-size="13" font-weight="700" fill="#fff" text-anchor="start">6.25 MW available at the fence</text><rect x="32" y="180" width="168" height="84" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="116" y="212.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Module 1</text><text x="116" y="236.0" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT · 1.56 MW draw</text><rect x="216" y="180" width="168" height="84" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="300" y="212.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Module 2</text><text x="300" y="236.0" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT · 1.56 MW draw</text><rect x="400" y="180" width="168" height="84" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="484" y="212.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Module 3</text><text x="484" y="236.0" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT · 1.56 MW draw</text><rect x="584" y="180" width="168" height="84" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="668" y="212.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Module 4</text><text x="668" y="236.0" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT · 1.56 MW draw</text><text x="32" y="290.0" font-size="17" font-weight="700" fill="#1d2433" text-anchor="start">Wells 20% low (8 MWe instead of 10), or reservoir cooling</text><text x="32" y="312.0" font-size="13.5" font-weight="400" fill="#5f6670" text-anchor="start">8 MWe still covers the 6.94 MW plant. This 3.06 MW well margin absorbs decline up to ~1.0 °C/yr for 25 years.</text><rect x="32" y="324" width="662.8242074927954" height="24" rx="6" fill="#e8a33d" stroke="none" stroke-width="2"/><text x="40" y="341.0" font-size="13" font-weight="700" fill="#fff" text-anchor="start">6.25 MW available at the fence</text><rect x="32" y="360" width="168" height="84" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="116" y="392.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Module 1</text><text x="116" y="416.0" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT · 1.56 MW draw</text><rect x="216" y="360" width="168" height="84" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="300" y="392.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Module 2</text><text x="300" y="416.0" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT · 1.56 MW draw</text><rect x="400" y="360" width="168" height="84" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="484" y="392.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Module 3</text><text x="484" y="416.0" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT · 1.56 MW draw</text><rect x="584" y="360" width="168" height="84" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="668" y="392.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Module 4</text><text x="668" y="416.0" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT · 1.56 MW draw</text><text x="32" y="470.0" font-size="17" font-weight="700" fill="#1d2433" text-anchor="start">One producer out (the real step)</text><text x="32" y="492.0" font-size="13.5" font-weight="400" fill="#5f6670" text-anchor="start">5.0 MW left → 4.0 MW IT → 3 whole modules; module 4 goes dark unless backup exists.</text><rect x="32" y="504" width="530.2593659942363" height="24" rx="6" fill="#e8a33d" stroke="none" stroke-width="2"/><text x="40" y="521.0" font-size="13" font-weight="700" fill="#fff" text-anchor="start">5.00 MW available at the fence</text><rect x="32" y="540" width="168" height="84" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="116" y="572.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Module 1</text><text x="116" y="596.0" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT · 1.56 MW draw</text><rect x="216" y="540" width="168" height="84" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="300" y="572.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Module 2</text><text x="300" y="596.0" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT · 1.56 MW draw</text><rect x="400" y="540" width="168" height="84" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="484" y="572.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Module 3</text><text x="484" y="596.0" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT · 1.56 MW draw</text><rect class="pulse" x="584" y="540" width="168" height="84" rx="10" fill="#f4f5f6" stroke="#5f6670" stroke-width="2" stroke-dasharray="8 6"/><text x="668" y="572.0" font-size="15" font-weight="700" fill="#5f6670" text-anchor="middle">Module 4</text><text x="668" y="596.0" font-size="12.5" font-weight="600" fill="#b91c1c" text-anchor="middle">DARK (shell built)</text><text x="32" y="650.0" font-size="17" font-weight="700" fill="#1d2433" text-anchor="start">Hot day + one producer out (illustrative)</text><text x="32" y="672.0" font-size="13.5" font-weight="400" fill="#5f6670" text-anchor="start">20% ORC derate on a 40 °C+ day (illustrative): 4.0 MW → 3.2 MW IT → 2 modules. Needs a vendor curve.</text><rect x="32" y="684" width="424.2" height="24" rx="6" fill="#e8a33d" stroke="none" stroke-width="2"/><text x="40" y="701.0" font-size="13" font-weight="700" fill="#fff" text-anchor="start">4.00 MW available at the fence</text><rect x="32" y="720" width="168" height="84" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="116" y="752.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Module 1</text><text x="116" y="776.0" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT · 1.56 MW draw</text><rect x="216" y="720" width="168" height="84" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="300" y="752.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Module 2</text><text x="300" y="776.0" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT · 1.56 MW draw</text><rect x="400" y="720" width="168" height="84" rx="10" fill="#f4f5f6" stroke="#5f6670" stroke-width="2" stroke-dasharray="8 6"/><text x="484" y="752.0" font-size="15" font-weight="700" fill="#5f6670" text-anchor="middle">Module 3</text><text x="484" y="776.0" font-size="12.5" font-weight="600" fill="#b91c1c" text-anchor="middle">DARK (shell built)</text><rect class="pulse" x="584" y="720" width="168" height="84" rx="10" fill="#f4f5f6" stroke="#5f6670" stroke-width="2" stroke-dasharray="8 6"/><text x="668" y="752.0" font-size="15" font-weight="700" fill="#5f6670" text-anchor="middle">Module 4</text><text x="668" y="776.0" font-size="12.5" font-weight="600" fill="#b91c1c" text-anchor="middle">DARK (shell built)</text><rect x="32" y="832" width="736" height="70" rx="10" fill="#eef4f2" stroke="#0b6b5c" stroke-width="2"/><text x="48" y="858.0" font-size="15" font-weight="700" fill="#0b6b5c" text-anchor="start">Rule: IT you can switch on = DEPENDABLE MW at the fence ÷ PUE, in whole modules.</text><text x="48" y="882.0" font-size="13.5" font-weight="400" fill="#1d2433" text-anchor="start">Cover (BESS, standby generation, local gas) must be contracted before modules 3-4 are sold uninterruptible.</text>
<text x="32" y="930" font-size="12.5" fill="#5f6670">Illustrative - not to scale. 1.25 MW-IT module step; cases are stress tests, not forecasts. Not an offer.</text>
</svg>