<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" width="800" height="760" font-family="Inter, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Power path: generator to racks</title><desc id="d">Generator gross output feeds a plant auxiliary board where parasitic loads are taken off, then a net meter at the fence, then an MV site bus feeding four modules each with its own MV/LV transformer, UPS and PDUs. Module 4 is interruptible. A grid-forming battery, black-start source and standby generation are shown as required, costed only at public-proxy rates.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="800" height="760" fill="#ffffff"/>
<text x="32" y="48" font-size="26" font-weight="700" fill="#1d2433">Power path: generator to racks</text>
<text x="32" y="74" font-size="15" fill="#5f6670">Archegon · illustrative concept, not to scale · not an engineering design</text>
<rect x="300" y="96" width="200" height="58" rx="10" fill="#0b6b5c" stroke="none" stroke-width="2"/><text x="400.0" y="131.0" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Generator (gross)</text><polyline points="400,154 400,186" fill="none" stroke="#1d2433" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="560" y="96" width="200" height="58" rx="10" fill="#9b5de5" stroke="none" stroke-width="2"/><text x="660.0" y="121.9" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Plant auxiliaries</text><text x="660.0" y="140.1" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">(parasitic)</text><polyline points="470,206 560,206 560,158" fill="none" stroke="#1d2433" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="300" y="188" width="200" height="36" rx="8" fill="#fff" stroke="#1d2433" stroke-width="2"/><text x="400" y="212.0" font-size="14" font-weight="600" fill="#1d2433" text-anchor="middle">Plant aux board</text><polyline points="400,224 400,250" fill="none" stroke="#1d2433" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="300" y="252" width="200" height="36" rx="8" fill="#fff" stroke="#0b6b5c" stroke-width="2"/><text x="400" y="276.0" font-size="14" font-weight="700" fill="#0b6b5c" text-anchor="middle">NET meter at the fence</text><polyline points="400,288 400,314" fill="none" stroke="#1d2433" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><line x1="40" y1="320" x2="760" y2="320" stroke="#1d2433" stroke-width="8"/><text x="40" y="342.0" font-size="14" font-weight="600" fill="#5f6670" text-anchor="start">MV site bus</text><rect x="32" y="96" width="230" height="96" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 5"/><text x="147" y="120.0" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">REQUIRED · PROXY-COSTED</text><text x="147" y="140.0" font-size="13" font-weight="600" fill="#1d2433" text-anchor="middle">Grid-forming BESS + black start</text><text x="147" y="156.9" font-size="13" font-weight="600" fill="#1d2433" text-anchor="middle">standby gen / local gas (N-1)</text><polyline points="147,192 147,318" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linejoin="round" stroke-dasharray="6 5"/><polyline points="122,320 122,360" fill="none" stroke="#1d2433" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="40" y="362" width="165" height="262" rx="12" fill="#eef4f2" stroke="#0b6b5c" stroke-width="2"/><text x="122" y="388.0" font-size="16" font-weight="700" fill="#1d2433" text-anchor="middle">Module 1</text><rect x="60" y="400" width="125" height="40" rx="10" fill="#0b6b5c" stroke="none" stroke-width="2"/><text x="122.5" y="426.0" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">MV/LV transformer</text><rect x="60" y="448" width="125" height="40" rx="10" fill="#0b6b5c" stroke="none" stroke-width="2"/><text x="122.5" y="474.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">UPS</text><rect x="60" y="496" width="125" height="40" rx="10" fill="#0b6b5c" stroke="none" stroke-width="2"/><text x="122.5" y="522.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">PDUs</text><rect x="62" y="548" width="24" height="46" rx="3" fill="#0b6b5c" stroke="none" stroke-width="2"/><rect x="93" y="548" width="24" height="46" rx="3" fill="#0b6b5c" stroke="none" stroke-width="2"/><rect x="124" y="548" width="24" height="46" rx="3" fill="#0b6b5c" stroke="none" stroke-width="2"/><rect x="155" y="548" width="24" height="46" rx="3" fill="#0b6b5c" stroke="none" stroke-width="2"/><polyline points="307,320 307,360" fill="none" stroke="#1d2433" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="225" y="362" width="165" height="262" rx="12" fill="#eef4f2" stroke="#0b6b5c" stroke-width="2"/><text x="307" y="388.0" font-size="16" font-weight="700" fill="#1d2433" text-anchor="middle">Module 2</text><rect x="245" y="400" width="125" height="40" rx="10" fill="#0b6b5c" stroke="none" stroke-width="2"/><text x="307.5" y="426.0" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">MV/LV transformer</text><rect x="245" y="448" width="125" height="40" rx="10" fill="#0b6b5c" stroke="none" stroke-width="2"/><text x="307.5" y="474.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">UPS</text><rect x="245" y="496" width="125" height="40" rx="10" fill="#0b6b5c" stroke="none" stroke-width="2"/><text x="307.5" y="522.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">PDUs</text><rect x="247" y="548" width="24" height="46" rx="3" fill="#0b6b5c" stroke="none" stroke-width="2"/><rect x="278" y="548" width="24" height="46" rx="3" fill="#0b6b5c" stroke="none" stroke-width="2"/><rect x="309" y="548" width="24" height="46" rx="3" fill="#0b6b5c" stroke="none" stroke-width="2"/><rect x="340" y="548" width="24" height="46" rx="3" fill="#0b6b5c" stroke="none" stroke-width="2"/><polyline points="492,320 492,360" fill="none" stroke="#1d2433" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="410" y="362" width="165" height="262" rx="12" fill="#eef4f2" stroke="#0b6b5c" stroke-width="2"/><text x="492" y="388.0" font-size="16" font-weight="700" fill="#1d2433" text-anchor="middle">Module 3</text><rect x="430" y="400" width="125" height="40" rx="10" fill="#0b6b5c" stroke="none" stroke-width="2"/><text x="492.5" y="426.0" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">MV/LV transformer</text><rect x="430" y="448" width="125" height="40" rx="10" fill="#0b6b5c" stroke="none" stroke-width="2"/><text x="492.5" y="474.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">UPS</text><rect x="430" y="496" width="125" height="40" rx="10" fill="#0b6b5c" stroke="none" stroke-width="2"/><text x="492.5" y="522.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">PDUs</text><rect x="432" y="548" width="24" height="46" rx="3" fill="#0b6b5c" stroke="none" stroke-width="2"/><rect x="463" y="548" width="24" height="46" rx="3" fill="#0b6b5c" stroke="none" stroke-width="2"/><rect x="494" y="548" width="24" height="46" rx="3" fill="#0b6b5c" stroke="none" stroke-width="2"/><rect x="525" y="548" width="24" height="46" rx="3" fill="#0b6b5c" stroke="none" stroke-width="2"/><polyline points="677,320 677,360" fill="none" stroke="#1d2433" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="595" y="362" width="165" height="262" rx="12" fill="#f4f5f6" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 6"/><text x="677" y="388.0" font-size="16" font-weight="700" fill="#1d2433" text-anchor="middle">Module 4</text><rect x="615" y="400" width="125" height="40" rx="10" fill="#7c3aed" stroke="none" stroke-width="2"/><text x="677.5" y="426.0" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">MV/LV transformer</text><rect x="615" y="448" width="125" height="40" rx="10" fill="#7c3aed" stroke="none" stroke-width="2"/><text x="677.5" y="474.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">UPS</text><rect x="615" y="496" width="125" height="40" rx="10" fill="#7c3aed" stroke="none" stroke-width="2"/><text x="677.5" y="522.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">PDUs</text><rect x="617" y="548" width="24" height="46" rx="3" fill="#7c3aed" stroke="none" stroke-width="2"/><rect x="648" y="548" width="24" height="46" rx="3" fill="#7c3aed" stroke="none" stroke-width="2"/><rect x="679" y="548" width="24" height="46" rx="3" fill="#7c3aed" stroke="none" stroke-width="2"/><rect x="710" y="548" width="24" height="46" rx="3" fill="#7c3aed" stroke="none" stroke-width="2"/><text class="pulse" x="677" y="612.0" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="middle">Interruptible</text><text x="32" y="664.0" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">Net nameplate 6.94 MW (after parasitics) · 6.25 MW AVERAGE at the fence (× 0.90 capacity factor), not firm.</text><text x="32" y="682.2" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">One producer out: 5.0 MW firm → 4.0 MW IT → 3 whole modules. Module 4 is sold as interruptible</text><text x="32" y="700.4" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">unless backup is bought. UPS covers seconds to minutes; it is not a second supply.</text>
<text x="32" y="740" font-size="12.5" fill="#5f6670">Illustrative - not to scale. Concept single-line; voltages, ratings and protection not designed. Not an offer.</text>
</svg>