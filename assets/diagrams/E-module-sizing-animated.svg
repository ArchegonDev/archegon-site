<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" width="800" height="780" font-family="Inter, Arial, Helvetica, sans-serif" role="img" aria-label="Sizing modules to the power block">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker></defs><style>
.fl{stroke-dashoffset:0}
@media (prefers-reduced-motion: no-preference){
 .fl{animation-timing-function:linear;animation-iteration-count:infinite}
 .fl12{animation-name:f12}.fl14{animation-name:f14}.fl16{animation-name:f16}.fl18{animation-name:f18}
 @keyframes f12{from{stroke-dashoffset:12}to{stroke-dashoffset:0}}
 @keyframes f14{from{stroke-dashoffset:14}to{stroke-dashoffset:0}}
 @keyframes f16{from{stroke-dashoffset:16}to{stroke-dashoffset:0}}
 @keyframes f18{from{stroke-dashoffset:18}to{stroke-dashoffset:0}}
 .e4{opacity:0;animation:e4 6s ease-in-out infinite}
 @keyframes e4{0%,8%{opacity:0}15%,45%{opacity:1}58%,100%{opacity:0}}
 .hl{opacity:0}
 .hl1{animation:h1 6s ease-in-out infinite}.hl2{animation:h2 6s ease-in-out infinite}
 @keyframes h1{0%,5%{opacity:0}12%,42%{opacity:1}50%,100%{opacity:0}}
 @keyframes h2{0%,50%{opacity:0}58%,92%{opacity:1}100%{opacity:0}}
}
@media (prefers-reduced-motion: reduce){ .rm-hide{display:none} }
</style>
<rect width="800" height="780" fill="#ffffff"/>
<text x="32" y="48" font-size="26" font-weight="700" fill="#1d2433">Sizing modules to the power block</text>
<text x="32" y="74" font-size="15" fill="#8a8f98">Archegon · illustrative concept, not to scale · not an engineering design</text>
<text x="32" y="120.0" font-size="18" font-weight="700" fill="#1d2433" text-anchor="start">Base case: wells deliver as modelled</text><text x="32" y="144.0" font-size="14" font-weight="400" fill="#8a8f98" text-anchor="start">4 modules × 1.25 MW IT = 5.0 MW IT; × PUE 1.25 = 6.25 MW draw (average, not firm)</text><rect x="32" y="160" width="625.6" height="26" rx="6" fill="#e8a33d" stroke="none" stroke-width="2"/><text x="40" y="179.0" font-size="14" font-weight="700" fill="#fff" text-anchor="start">6.25 MW average at the fence</text><rect x="32" y="204" width="168" height="110" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="116" y="242.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Module 1</text><text x="116" y="266.0" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT</text><text x="116" y="288.0" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">1.56 MW draw</text><rect x="216" y="204" width="168" height="110" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="300" y="242.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Module 2</text><text x="300" y="266.0" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT</text><text x="300" y="288.0" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">1.56 MW draw</text><rect x="400" y="204" width="168" height="110" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="484" y="242.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Module 3</text><text x="484" y="266.0" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT</text><text x="484" y="288.0" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">1.56 MW draw</text><rect x="584" y="204" width="168" height="110" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="668" y="242.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Module 4</text><text x="668" y="266.0" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT</text><text x="668" y="288.0" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">1.56 MW draw</text><text x="32" y="380.0" font-size="18" font-weight="700" fill="#1d2433" text-anchor="start">Wells 20% low</text><text x="32" y="404.0" font-size="14" font-weight="400" fill="#8a8f98" text-anchor="start">5.0 MW available: 3 modules (4.69 MW draw, 3.75 MW IT) fit; the 4th stays dark</text><rect x="32" y="420" width="500.47999999999996" height="26" rx="6" fill="#e8a33d" stroke="none" stroke-width="2"/><text x="40" y="439.0" font-size="14" font-weight="700" fill="#fff" text-anchor="start">5.00 MW average at the fence</text><rect x="32" y="464" width="168" height="110" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="116" y="502.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Module 1</text><text x="116" y="526.0" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT</text><text x="116" y="548.0" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">1.56 MW draw</text><rect x="216" y="464" width="168" height="110" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="300" y="502.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Module 2</text><text x="300" y="526.0" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT</text><text x="300" y="548.0" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">1.56 MW draw</text><rect x="400" y="464" width="168" height="110" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="484" y="502.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Module 3</text><text x="484" y="526.0" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT</text><text x="484" y="548.0" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">1.56 MW draw</text><rect x="584" y="464" width="168" height="110" rx="10" fill="#f4f5f6" stroke="#8a8f98" stroke-width="2" stroke-dasharray="8 6"/><text x="668" y="502.0" font-size="16" font-weight="700" fill="#8a8f98" text-anchor="middle">Module 4</text><text x="668" y="526.0" font-size="15" font-weight="600" fill="#d1495b" text-anchor="middle">DARK</text><text x="668" y="548.0" font-size="13" font-weight="400" fill="#8a8f98" text-anchor="middle">shell built, unpowered</text><rect x="32" y="640" width="736" height="90" rx="10" fill="#eef4f2" stroke="#0b6b5c" stroke-width="2"/><text x="48" y="668.0" font-size="15" font-weight="700" fill="#0b6b5c" text-anchor="start">Rule: IT you can switch on = MW at the fence ÷ PUE, in whole modules.</text><text x="48" y="694.0" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">Cover for a short block must be contracted before IT is ordered:</text><text x="48" y="712.2" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">grid import, other on-site generation, or shedding whole modules.</text>
<text x="32" y="760" font-size="12.5" fill="#8a8f98">Illustrative - not to scale. 1.25 MW-IT module step; 20% case is a stress test, not a forecast. Not an offer.</text>
<g aria-hidden="true"><g class="e4"><rect x="584" y="464" width="168" height="110" rx="10" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="668" y="502.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Module 4</text><text x="668" y="526.0" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">1.25 MW IT</text><text x="668" y="548.0" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">1.56 MW draw</text></g><rect class="hl hl1" x="20" y="100" width="760" height="226" rx="12" fill="none" stroke="#e8a33d" stroke-width="3"/><rect class="hl hl2" x="20" y="360" width="760" height="226" rx="12" fill="none" stroke="#d1495b" stroke-width="3"/></g>
</svg>