<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 940" width="800" height="940" font-family="Inter, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How an EGS well pair works</title><desc id="d">Cross-section: cool water is pumped down an injector to a lower horizontal lateral, sweeps heat upward through stimulated fractures, and returns hot up a producer from an upper lateral. Notes give flow-to-power context from Habanero and Fervo Project Red.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="800" height="940" fill="#ffffff"/>
<text x="32" y="48" font-size="26" font-weight="700" fill="#1d2433">How an EGS well pair works</text>
<text x="32" y="74" font-size="15" fill="#5f6670">Archegon · illustrative concept, not to scale · not an engineering design</text>
<rect x="0" y="130" width="800" height="210" fill="#f3efe7"/><rect x="0" y="340" width="800" height="400" fill="#e7e2ea"/><text x="780" y="160.0" font-size="14" font-weight="400" fill="#5f6670" text-anchor="end">Sedimentary cover</text><text x="780" y="370.0" font-size="14" font-weight="400" fill="#5f6670" text-anchor="end">Hot granite basement</text><line x1="0" y1="130" x2="800" y2="130" stroke="#1d2433" stroke-width="2"/><text x="780" y="420.0" font-size="14" font-weight="600" fill="#d1495b" text-anchor="end">Engineered reservoir, ~3.5–4.5 km deep</text><text x="780" y="440.0" font-size="13" font-weight="400" fill="#5f6670" text-anchor="end">(Cooper Basin EGS wells reached 4,850 m)</text><rect x="130" y="470" width="600" height="190" rx="14" fill="#f6d9dc" stroke="#d1495b" stroke-width="2" stroke-dasharray="6 6"/><line class="pulse" x1="200" y1="505" x2="210" y2="645" stroke="#9b5de5" stroke-width="3"/><line class="pulse" x1="248" y1="505" x2="258" y2="645" stroke="#9b5de5" stroke-width="3"/><line class="pulse" x1="296" y1="505" x2="306" y2="645" stroke="#9b5de5" stroke-width="3"/><line class="pulse" x1="344" y1="505" x2="354" y2="645" stroke="#9b5de5" stroke-width="3"/><line class="pulse" x1="392" y1="505" x2="402" y2="645" stroke="#9b5de5" stroke-width="3"/><line class="pulse" x1="440" y1="505" x2="450" y2="645" stroke="#9b5de5" stroke-width="3"/><line class="pulse" x1="488" y1="505" x2="498" y2="645" stroke="#9b5de5" stroke-width="3"/><line class="pulse" x1="536" y1="505" x2="546" y2="645" stroke="#9b5de5" stroke-width="3"/><line class="pulse" x1="584" y1="505" x2="594" y2="645" stroke="#9b5de5" stroke-width="3"/><line class="pulse" x1="632" y1="505" x2="642" y2="645" stroke="#9b5de5" stroke-width="3"/><line class="pulse" x1="680" y1="505" x2="690" y2="645" stroke="#9b5de5" stroke-width="3"/><polyline points="170,130 170,595 205,630 700,630" fill="none" stroke="#2a9df4" stroke-width="8" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="700,510 150,510 110,475 110,135" fill="none" stroke="#d1495b" stroke-width="8" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="265,620 265,522" fill="none" stroke="#0b6b5c" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="360,620 360,522" fill="none" stroke="#0b6b5c" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="455,620 455,522" fill="none" stroke="#0b6b5c" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="550,620 550,522" fill="none" stroke="#0b6b5c" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="645,620 645,522" fill="none" stroke="#0b6b5c" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text x="60" y="115.0" font-size="15" font-weight="700" fill="#d1495b" text-anchor="start">PRODUCER</text><text x="160" y="115.0" font-size="15" font-weight="700" fill="#2a9df4" text-anchor="start">INJECTOR</text><text x="186" y="250.0" font-size="14" font-weight="600" fill="#2a9df4" text-anchor="start">Cool water pumped down the injector</text><text x="20" y="300.0" font-size="14" font-weight="600" fill="#d1495b" text-anchor="start">Hot water</text><text x="20" y="318.2" font-size="14" font-weight="600" fill="#d1495b" text-anchor="start">flows up the</text><text x="20" y="336.4" font-size="14" font-weight="600" fill="#d1495b" text-anchor="start">producer</text><text x="250" y="700.0" font-size="14" font-weight="600" fill="#0b6b5c" text-anchor="start">Water sweeps heat through stimulated fractures, lower lateral to upper</text><rect x="32" y="740" width="736" height="150" rx="10" fill="#eef4f2" stroke="#0b6b5c" stroke-width="2"/><text x="48" y="766.0" font-size="15" font-weight="700" fill="#0b6b5c" text-anchor="start">What a producer delivers depends on measured flow and temperature</text><text x="48" y="790.0" font-size="13.5" font-weight="400" fill="#1d2433" text-anchor="start">• Habanero (Cooper Basin) best sustained loop: 19 kg/s, ≈ 1.0–1.5 MWe net.</text><text x="48" y="807.5" font-size="13.5" font-weight="400" fill="#1d2433" text-anchor="start">• 5 MWe net per producer would need ~64–97 kg/s at 215 °C (screening calc).</text><text x="48" y="825.1" font-size="13.5" font-weight="400" fill="#1d2433" text-anchor="start">• Fervo Project Red (Utah, 2023): 63 L/s peak at 169 °C, 3.5 MWe peak; 1.4 MW net sustained.</text><text x="48" y="842.6" font-size="13.5" font-weight="400" fill="#1d2433" text-anchor="start">• Habanero permeability was a sub-horizontal fault; stacked laterals are unproven there.</text>
<text x="32" y="920" font-size="12.5" fill="#5f6670">Illustrative - not to scale. Injector drawn below producer (cold water sinks); final placement per reservoir design. Not an offer.</text>
</svg>