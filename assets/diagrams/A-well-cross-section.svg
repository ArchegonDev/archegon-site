<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" font-family="Inter, Arial, Helvetica, sans-serif" role="img" aria-label="How an EGS well pair works">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker></defs>
<rect width="800" height="900" fill="#ffffff"/>
<text x="32" y="48" font-size="26" font-weight="700" fill="#1d2433">How an EGS well pair works</text>
<text x="32" y="74" font-size="15" fill="#8a8f98">Archegon · illustrative concept, not to scale · not an engineering design</text>
<rect x="0" y="130" width="800" height="200" fill="#f3efe7"/><rect x="0" y="330" width="800" height="380" fill="#e7e2ea"/><text x="780" y="160.0" font-size="14" font-weight="400" fill="#8a8f98" text-anchor="end">Sedimentary cover</text><text x="780" y="360.0" font-size="14" font-weight="400" fill="#8a8f98" text-anchor="end">Hot granite basement</text><line x1="0" y1="130" x2="800" y2="130" stroke="#1d2433" stroke-width="2"/><rect x="130" y="520" width="580" height="140" rx="14" fill="#f6d9dc" stroke="#d1495b" stroke-width="2" stroke-dasharray="6 6"/><text x="710" y="508.0" font-size="14" font-weight="600" fill="#d1495b" text-anchor="end">Engineered reservoir, ~3–4 km deep (illustrative)</text><line x1="200" y1="545" x2="212" y2="650" stroke="#9b5de5" stroke-width="3"/><line x1="245" y1="545" x2="257" y2="650" stroke="#9b5de5" stroke-width="3"/><line x1="290" y1="545" x2="302" y2="650" stroke="#9b5de5" stroke-width="3"/><line x1="335" y1="545" x2="347" y2="650" stroke="#9b5de5" stroke-width="3"/><line x1="380" y1="545" x2="392" y2="650" stroke="#9b5de5" stroke-width="3"/><line x1="425" y1="545" x2="437" y2="650" stroke="#9b5de5" stroke-width="3"/><line x1="470" y1="545" x2="482" y2="650" stroke="#9b5de5" stroke-width="3"/><line x1="515" y1="545" x2="527" y2="650" stroke="#9b5de5" stroke-width="3"/><line x1="560" y1="545" x2="572" y2="650" stroke="#9b5de5" stroke-width="3"/><line x1="605" y1="545" x2="617" y2="650" stroke="#9b5de5" stroke-width="3"/><line x1="650" y1="545" x2="662" y2="650" stroke="#9b5de5" stroke-width="3"/><polyline points="170,130 170,520 200,560 690,560" fill="none" stroke="#2a9df4" stroke-width="8" stroke-linejoin="round"/><polyline points="110,130 110,580 140,620 690,620" fill="none" stroke="#d1495b" stroke-width="8" stroke-linejoin="round"/><polyline points="190,150 190,300" fill="none" stroke="#2a9df4" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="90,300 90,150" fill="none" stroke="#d1495b" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="260,572 260,606" fill="none" stroke="#0b6b5c" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="350,572 350,606" fill="none" stroke="#0b6b5c" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="440,572 440,606" fill="none" stroke="#0b6b5c" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="530,572 530,606" fill="none" stroke="#0b6b5c" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="620,572 620,606" fill="none" stroke="#0b6b5c" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text x="60" y="115.0" font-size="15" font-weight="700" fill="#d1495b" text-anchor="start">PRODUCER</text><text x="160" y="115.0" font-size="15" font-weight="700" fill="#2a9df4" text-anchor="start">INJECTOR</text><text x="210" y="230.0" font-size="15" font-weight="400" fill="#2a9df4" text-anchor="start">Cool water pumped down</text><text x="210" y="252.0" font-size="15" font-weight="400" fill="#d1495b" text-anchor="start">Hot water returns up</text><text x="260" y="700.0" font-size="15" font-weight="600" fill="#0b6b5c" text-anchor="start">Water sweeps heat from fractures between two horizontal wells</text><text x="32" y="780.0" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">Fervo Project Red reference (2023 test): ~3,250 ft (~1 km) laterals, ~365 ft apart,</text><text x="32" y="798.2" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">multistage stimulation, up to 63 L/s at 336 °F, 3.5 MWe peak.</text><text x="32" y="830.0" font-size="14" font-weight="600" fill="#0b6b5c" text-anchor="start">One injector–producer pair shown. Illustrative rating: 5 MWe net per producing well.</text>
<text x="32" y="880" font-size="12.5" fill="#8a8f98">Illustrative - not to scale. Sources: Norbeck &amp; Latimer 2023 (EarthArXiv, CC BY 4.0); Ertas 2025 (SGW). Not an offer.</text>
</svg>