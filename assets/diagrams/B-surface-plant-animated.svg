stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="495,180 495,232" fill="none" stroke="#d1495b" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="580,268 770,268 770,672 384,672" fill="none" stroke="#2a9df4" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="210,672 176,672" fill="none" stroke="#2a9df4" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="620" y="104" width="150" height="64" rx="10" fill="#e8a33d" stroke="none" stroke-width="2"/><text x="695.0" y="142.0" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Turbine</text><rect x="620" y="198" width="150" height="0" rx="10" fill="#e8a33d" stroke="none" stroke-width="2"/><text x="695.0" y="204.0" font-size="15" font-weight="600" fill="#fff" text-anchor="middle"></text><rect x="410" y="380" width="170" height="64" rx="10" fill="#c98a2b" stroke="none" stroke-width="2"/><text x="495.0" y="418.0" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Recuperator</text><rect x="410" y="520" width="170" height="72" rx="10" fill="#5b6b7a" stroke="none" stroke-width="2"/><text x="495.0" y="552.9" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Air-cooled</text><text x="495.0" y="571.1" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">condenser</text><rect x="210" y="450" width="150" height="60" rx="10" fill="#e8a33d" stroke="none" stroke-width="2"/><text x="285.0" y="486.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Feed pump</text><rect x="620" y="380" width="150" height="64" rx="10" fill="#0b6b5c" stroke="none" stroke-width="2"/><text x="695.0" y="418.0" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Generator</text><polyline points="580,130 616,130" fill="none" stroke="#e8a33d" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="645,168 645,250 560,376" fill="none" stroke="#e8a33d" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="495,444 495,516" fill="none" stroke="#e8a33d" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="410,560 285,560 285,514" fill="none" stroke="#e8a33d" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="285,446 285,412 406,412" fill="none" stroke="#e8a33d" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="430,376 430,304" fill="none" stroke="#e8a33d" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="470,232 470,184" fill="none" stroke="#e8a33d" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><line x1="770" y1="168" x2="770" y2="168" /><polyline points="700,168 700,376" fill="none" stroke="#1d2433" stroke-width="3" stroke-linejoin="round"/><text x="708" y="270.0" font-size="12" font-weight="400" fill="#5f6670" text-anchor="start">shaft</text><polyline points="695,444 695,480 780,480" fill="none" stroke="#1d2433" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text x="600" y="500.0" font-size="14" font-weight="700" fill="#0b6b5c" text-anchor="start">Gross power out</text><rect x="32" y="250" width="160" height="150" rx="10" fill="#fff" stroke="#e8a33d" stroke-width="2" stroke-dasharray="6 4"/><text x="44" y="274.0" font-size="13" font-weight="600" fill="#1d2433" text-anchor="start">Two circuits that</text><text x="44" y="290.9" font-size="13" font-weight="600" fill="#1d2433" text-anchor="start">exchange heat but</text><text x="44" y="307.8" font-size="13" font-weight="600" fill="#1d2433" text-anchor="start">NEVER mix:</text><text x="44" y="324.7" font-size="13" font-weight="600" fill="#1d2433" text-anchor="start">brine (red→blue)</text><text x="44" y="341.6" font-size="13" font-weight="600" fill="#1d2433" text-anchor="start">working fluid</text><text x="44" y="358.5" font-size="13" font-weight="600" fill="#1d2433" text-anchor="start">(amber, closed)</text><rect x="32" y="430" width="160" height="180" rx="10" fill="#eef4f2" stroke="#0b6b5c" stroke-width="2"/><text x="44" y="454.0" font-size="13" font-weight="400" fill="#1d2433" text-anchor="start">Parasitic load</text><text x="44" y="470.9" font-size="13" font-weight="400" fill="#1d2433" text-anchor="start">reinjection pump,</text><text x="44" y="487.8" font-size="13" font-weight="400" fill="#1d2433" text-anchor="start">feed pump,</text><text x="44" y="504.7" font-size="13" font-weight="400" fill="#1d2433" text-anchor="start">condenser fans,</text><text x="44" y="521.6" font-size="13" font-weight="400" fill="#1d2433" text-anchor="start">services. Taken</text><text x="44" y="538.5" font-size="13" font-weight="400" fill="#1d2433" text-anchor="start">from gross before</text><text x="44" y="555.4" font-size="13" font-weight="400" fill="#1d2433" text-anchor="start">the fence (net).</text>
<text x="32" y="740" font-size="12.5" fill="#5f6670">Illustrative - not to scale. Recuperated ORC per US DOE GeoVision Ch.2 (public domain). No sizing implied. Not an offer.</text>
