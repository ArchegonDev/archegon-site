<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 740" width="800" height="740" font-family="Inter, Arial, Helvetica, sans-serif" role="img" aria-label="Surface plant: one binary power block">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
