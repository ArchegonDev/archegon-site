text x="335.0" y="485.6" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">Air-cooled</text><text x="335.0" y="506.40000000000003" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">condenser</text><rect x="240" y="610" width="170" height="70" rx="10" fill="#2a9df4" stroke="none" stroke-width="2"/><text x="325.0" y="640.6" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">Reinjection</text><text x="325.0" y="661.4" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">pump</text><polyline points="182,155 236,155" fill="none" stroke="#d1495b" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="410,155 466,155" fill="none" stroke="#d1495b" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="555,200 555,266" fill="none" stroke="#e8a33d" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="555,340 555,376" fill="none" stroke="#1d2433" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="470,305 424,330" fill="none" stroke="#e8a33d" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="335,370 335,446" fill="none" stroke="#e8a33d" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="250,490 215,490 215,250 500,250 500,204" fill="none" stroke="#e8a33d" stroke-width="4" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#ah)"/><polyline points="640,155 775,155 775,598 325,598 325,606" fill="none" stroke="#2a9df4" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="240,645 186,645" fill="none" stroke="#2a9df4" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="640,415 740,415" fill="none" stroke="#1d2433" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text x="650" y="400.0" font-size="14" font-weight="700" fill="#0b6b5c" text-anchor="start">Power out</text><text x="715" y="300.0" font-size="14" font-weight="400" fill="#2a9df4" text-anchor="start">Cooled</text><text x="715" y="318.2" font-size="14" font-weight="400" fill="#2a9df4" text-anchor="start">brine</text><text x="30" y="290.0" font-size="14" font-weight="600" fill="#e8a33d" text-anchor="start">Closed loop of</text><text x="30" y="308.2" font-size="14" font-weight="600" fill="#e8a33d" text-anchor="start">organic working</text><text x="30" y="326.4" font-size="14" font-weight="600" fill="#e8a33d" text-anchor="start">fluid (dashed)</text><rect x="460" y="470" width="290" height="112" rx="10" fill="#eef4f2" stroke="#0b6b5c" stroke-width="2"/><text x="485" y="498.0" font-size="15" font-weight="700" fill="#0b6b5c" text-anchor="start">Plant’s own load (parasitic)</text><text x="485" y="522.0" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">Fans, pumps, controls. Parasitic load</text><text x="485" y="540.2" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">not modelled; well ratings are</text><text x="485" y="558.4" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">taken as net (5 MWe per producer).</text>
<text x="32" y="720" font-size="12.5" fill="#8a8f98">Illustrative - not to scale. Plant type per US DOE GeoVision Ch.2 (public domain). No equipment sizing implied. Not an offer.</text>
