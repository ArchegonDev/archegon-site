<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" width="800" height="760" font-family="Inter, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Surface plant: one binary (ORC) power block</title><desc id="d">Brine from the production well passes a separator, the evaporator and the preheater, then is pumped back down the injection well with make-up water. The organic working fluid runs a separate closed loop: feed pump, recuperator cold side, preheater, evaporator, turbine, recuperator hot side, air-cooled condenser, back to the feed pump. The turbine drives the generator; parasitic loads come off gross output.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><style>
@media (prefers-reduced-motion: no-preference){
 .fl{stroke-dasharray:2 14;stroke-linecap:round;animation:fl 1.1s linear infinite}
 @keyframes fl{from{stroke-dashoffset:16}to{stroke-dashoffset:0}}
 .pulse{animation:pulse 3s ease-in-out infinite}
 @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
 .rot{transform-box:fill-box;transform-origin:center;animation:rot 1.6s linear infinite}
 @keyframes rot{to{transform:rotate(360deg)}}
 .ftb{}
}
@media (prefers-reduced-motion: reduce){.fl{display:none}}
</style>
<rect width="800" height="760" fill="#ffffff"/>
<text x="32" y="48" font-size="26" font-weight="700" fill="#1d2433">Surface plant: one binary (ORC) power block</text>
<text x="32" y="74" font-size="15" fill="#5f6670">Archegon · illustrative concept, not to scale · not an engineering design</text>
