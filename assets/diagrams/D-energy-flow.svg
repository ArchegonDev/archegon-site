<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 782" width="800" height="782" font-family="Inter, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">From well to rack: where the megawatts go</title><desc id="d">Chain from reservoir heat to racks: gross generation, net nameplate 6.94 MW, 6.25 MW average at the fence, 5.0 MW firm with one producer out, 5.0 MW average or 4.0 MW firm critical IT, and 38 GB200-class racks.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="800" height="782" fill="#ffffff"/>
<text x="32" y="48" font-size="26" font-weight="700" fill="#1d2433">From well to rack: where the megawatts go</text>
<text x="32" y="74" font-size="15" fill="#5f6670">Archegon · illustrative concept, not to scale · not an engineering design</text>
<text class="s0" x="32" y="128.0" font-size="16" font-weight="700" fill="#1d2433" text-anchor="start">Heat from the reservoir</text><rect class="s0" x="260" y="104" width="500" height="50" rx="8" fill="#fff" stroke="#7a3b52" stroke-width="2" stroke-dasharray="6 5"/><text class="s0" x="272" y="135.0" font-size="14" font-weight="600" fill="#7a3b52" text-anchor="start">Needs a flow/temperature test</text><polyline points="140,138 140,168" fill="none" stroke="#5f6670" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text class="s1" x="32" y="202.0" font-size="16" font-weight="700" fill="#1d2433" text-anchor="start">Gross generation</text><rect class="s1" x="260" y="178" width="500" height="50" rx="8" fill="#fff" stroke="#b8434f" stroke-width="2" stroke-dasharray="6 5"/><text class="s1" x="272" y="209.0" font-size="14" font-weight="600" fill="#b8434f" text-anchor="start">Net + parasitic (pumps, fans)</text><polyline points="140,212 140,242" fill="none" stroke="#5f6670" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text class="s2" x="32" y="276.0" font-size="16" font-weight="700" fill="#1d2433" text-anchor="start">Net nameplate</text><rect class="s2" x="260" y="252" width="347.0" height="50" rx="8" fill="#e8a33d" stroke="#e8a33d" stroke-width="2"/><text class="s2" x="272" y="283.0" font-size="14" font-weight="600" fill="#fff" text-anchor="start">6.94 MW after parasitics</text><polyline points="140,286 140,316" fill="none" stroke="#5f6670" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text class="s3" x="32" y="350.0" font-size="16" font-weight="700" fill="#1d2433" text-anchor="start">Average at the fence</text><rect class="s3" x="260" y="326" width="312.5" height="50" rx="8" fill="#c98a2b" stroke="#c98a2b" stroke-width="2"/><text class="s3" x="272" y="357.0" font-size="14" font-weight="600" fill="#fff" text-anchor="start">6.25 MW (× 0.90 CF), not firm</text><polyline points="140,360 140,390" fill="none" stroke="#5f6670" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text class="s4" x="32" y="424.0" font-size="16" font-weight="700" fill="#1d2433" text-anchor="start">Firm, one producer out</text><rect class="s4" x="260" y="400" width="250.0" height="50" rx="8" fill="#b91c1c" stroke="#b91c1c" stroke-width="2"/><text class="s4" x="272" y="431.0" font-size="14" font-weight="600" fill="#fff" text-anchor="start">5.0 MW (N-1), no backup</text><polyline points="140,434 140,464" fill="none" stroke="#5f6670" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text class="s5" x="32" y="498.0" font-size="16" font-weight="700" fill="#1d2433" text-anchor="start">Critical IT (÷ PUE 1.25)</text><rect class="s5" x="260" y="474" width="250.0" height="50" rx="8" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text class="s5" x="272" y="505.0" font-size="14" font-weight="600" fill="#fff" text-anchor="start">5.0 avg · 4.0 firm (MW)</text><polyline points="140,508 140,538" fill="none" stroke="#5f6670" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text class="s6" x="32" y="572.0" font-size="16" font-weight="700" fill="#1d2433" text-anchor="start">Racks</text><rect class="s6" x="260" y="548" width="500" height="50" rx="8" fill="#fff" stroke="#1d2433" stroke-width="2" stroke-dasharray="6 5"/><text class="s6" x="272" y="579.0" font-size="14" font-weight="600" fill="#1d2433" text-anchor="start">38 complete GB200-class (130 kW)</text><rect x="32" y="628" width="736" height="112" rx="10" fill="#eef4f2" stroke="#0b6b5c" stroke-width="2"/><text x="48" y="654.0" font-size="16" font-weight="700" fill="#0b6b5c" text-anchor="start">Read with care</text><text x="48" y="678.0" font-size="13.5" font-weight="400" fill="#1d2433" text-anchor="start">• Bars are drawn against 10 MWe of well capacity (2 producers × 5 MWe net, an ASSUMPTION).</text><text x="48" y="695.5" font-size="13.5" font-weight="400" fill="#1d2433" text-anchor="start">• Well ratings are NET: parasitic load is inside them, never deducted twice.</text><text x="48" y="713.1" font-size="13.5" font-weight="400" fill="#1d2433" text-anchor="start">• PUE 1.25 is an annual-average assumption; hot days run higher.</text>
<text x="32" y="762" font-size="12.5" fill="#5f6670">Illustrative - bars to scale against 10 MWe net. Public-benchmark example; not an offer.</text>
</svg>