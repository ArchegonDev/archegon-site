<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 860" width="800" height="860" font-family="Inter, Arial, Helvetica, sans-serif" role="img" aria-label="From well to rack: where the megawatts go">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker></defs>
<rect width="800" height="860" fill="#ffffff"/>
<text x="32" y="48" font-size="26" font-weight="700" fill="#1d2433">From well to rack: where the megawatts go</text>
<text x="32" y="74" font-size="15" fill="#8a8f98">Archegon · illustrative concept, not to scale · not an engineering design</text>
<text x="32" y="132.0" font-size="17" font-weight="700" fill="#1d2433" text-anchor="start">Underground heat</text><rect x="250" y="110" width="500" height="56" rx="8" fill="#fff" stroke="#7a3b52" stroke-width="2" stroke-dasharray="6 5"/><text x="262" y="134.0" font-size="15" font-weight="600" fill="#7a3b52" text-anchor="start">Thermal input</text><text x="262" y="153.5" font-size="15" font-weight="600" fill="#7a3b52" text-anchor="start">not modelled</text><polyline points="140,170 140,196" fill="none" stroke="#8a8f98" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text x="32" y="227.0" font-size="17" font-weight="700" fill="#1d2433" text-anchor="start">Well capacity</text><rect x="250" y="205" width="500.0" height="56" rx="8" fill="#d1495b" stroke="#d1495b" stroke-width="2"/><text x="262" y="229.0" font-size="15" font-weight="600" fill="#fff" text-anchor="start">2 producers × 5 MWe net</text><text x="262" y="248.5" font-size="15" font-weight="600" fill="#fff" text-anchor="start">= 10 MWe net (base)</text><polyline points="140,265 140,291" fill="none" stroke="#8a8f98" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text x="32" y="322.0" font-size="17" font-weight="700" fill="#1d2433" text-anchor="start">Net capacity needed</text><rect x="250" y="300" width="347.0" height="56" rx="8" fill="#e8a33d" stroke="#e8a33d" stroke-width="2"/><text x="262" y="324.0" font-size="15" font-weight="600" fill="#fff" text-anchor="start">6.94 MW net</text><polyline points="140,360 140,386" fill="none" stroke="#8a8f98" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text x="32" y="417.0" font-size="17" font-weight="700" fill="#1d2433" text-anchor="start">Average at fence</text><rect x="250" y="395" width="312.5" height="56" rx="8" fill="#c98a2b" stroke="#c98a2b" stroke-width="2"/><text x="262" y="419.0" font-size="15" font-weight="600" fill="#fff" text-anchor="start">6.25 MW average, not firm</text><text x="262" y="438.5" font-size="15" font-weight="600" fill="#fff" text-anchor="start">(× 0.90 capacity factor)</text><polyline points="140,455 140,481" fill="none" stroke="#8a8f98" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text x="32" y="512.0" font-size="17" font-weight="700" fill="#1d2433" text-anchor="start">IT load</text><rect x="250" y="490" width="250.0" height="56" rx="8" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text x="262" y="514.0" font-size="15" font-weight="600" fill="#fff" text-anchor="start">5.0 MW</text><text x="262" y="533.5" font-size="15" font-weight="600" fill="#fff" text-anchor="start">(÷ PUE 1.25)</text><polyline points="140,550 140,576" fill="none" stroke="#8a8f98" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text x="32" y="607.0" font-size="17" font-weight="700" fill="#1d2433" text-anchor="start">Racks</text><rect x="250" y="585" width="500" height="56" rx="8" fill="#fff" stroke="#1d2433" stroke-width="2" stroke-dasharray="6 5"/><text x="262" y="609.0" font-size="15" font-weight="600" fill="#1d2433" text-anchor="start">~38 GB200-class</text><text x="262" y="628.5" font-size="15" font-weight="600" fill="#1d2433" text-anchor="start">(130 kW each)</text><rect x="32" y="685" width="736" height="132" rx="10" fill="#eef4f2" stroke="#0b6b5c" stroke-width="2"/><text x="48" y="712.0" font-size="16" font-weight="700" fill="#0b6b5c" text-anchor="start">What is not yet in the chain</text><text x="48" y="736.0" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">• Parasitic load not modelled; well ratings are taken as net.</text><text x="48" y="754.2" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">• 6.25 MW is an average; firm supply for IT needs backup or grid import.</text><text x="48" y="772.4" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">• PUE 1.25 is an assumption; a 1.48 survey average would cut IT to ~4.2 MW.</text><text x="48" y="790.6" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">• Thermal input and well flow rate are not modelled.</text>
<text x="32" y="840" font-size="12.5" fill="#8a8f98">Illustrative - not to scale except bars (against 10 MWe net). Public-benchmark example; not an offer.</text>
</svg>