10" fill="#c9ccd1" stroke="none" stroke-width="2"/><text x="677.5" y="488.0" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">PDUs</text><rect x="617" y="520" width="24" height="50" rx="3" fill="#c9ccd1" stroke="none" stroke-width="2"/><rect x="648" y="520" width="24" height="50" rx="3" fill="#c9ccd1" stroke="none" stroke-width="2"/><rect x="679" y="520" width="24" height="50" rx="3" fill="#c9ccd1" stroke="none" stroke-width="2"/><rect x="710" y="520" width="24" height="50" rx="3" fill="#c9ccd1" stroke="none" stroke-width="2"/><text x="677" y="630.0" font-size="15" font-weight="700" fill="#d1495b" text-anchor="middle">Can be left dark</text><text x="677" y="649.5" font-size="15" font-weight="700" fill="#d1495b" text-anchor="middle">if wells run low</text><text x="32" y="700.0" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">Illustrative: 4 modules × 1.25 MW IT = 5.0 MW IT; × PUE 1.25 = 6.25 MW average at the fence</text><text x="32" y="718.2" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">(after 0.90 capacity factor; average, not firm power). 6.94 MW net capacity needed. ~38 racks at 130 kW.</text><text x="32" y="736.4" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">UPS covers seconds to minutes; it is not a second power supply. Parasitic load not modelled.</text>
<text x="32" y="780" font-size="12.5" fill="#8a8f98">Illustrative - not to scale. Concept single-line; voltages, ratings and protection not designed. Not an offer.</text>
