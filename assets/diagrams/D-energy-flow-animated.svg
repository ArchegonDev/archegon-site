<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 860" width="800" height="860" font-family="Inter, Arial, Helvetica, sans-serif" role="img" aria-label="From well to rack: where the megawatts go">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker></defs><style>
.fl{stroke-dashoffset:0}
@media (prefers-reduced-motion: no-preference){
 .fl{animation-timing-function:linear;animation-iteration-count:infinite}
 .fl12{animation-name:f12}.fl14{animation-name:f14}.fl16{animation-name:f16}.fl18{animation-name:f18}
 @keyframes f12{from{stroke-dashoffset:12}to{stroke-dashoffset:0}}
 @keyframes f14{from{stroke-dashoffset:14}to{stroke-dashoffset:0}}
 @keyframes f16{from{stroke-dashoffset:16}to{stroke-dashoffset:0}}
 @keyframes f18{from{stroke-dashoffset:18}to{stroke-dashoffset:0}}
 .s0{animation:fadein 6s ease-out infinite;animation-name:f0}@keyframes f0{0%,4%{opacity:.15}12%,92%{opacity:1}100%{opacity:.15}}
 .s1{animation:fadein 6s ease-out infinite;animation-name:f1}@keyframes f1{0%,16%{opacity:.15}24%,92%{opacity:1}100%{opacity:.15}}
 .s2{animation:fadein 6s ease-out infinite;animation-name:f2}@keyframes f2{0%,28%{opacity:.15}36%,92%{opacity:1}100%{opacity:.15}}
 .s3{animation:fadein 6s ease-out infinite;animation-name:f3}@keyframes f3{0%,40%{opacity:.15}48%,92%{opacity:1}100%{opacity:.15}}
 .s4{animation:fadein 6s ease-out infinite;animation-name:f4}@keyframes f4{0%,52%{opacity:.15}60%,92%{opacity:1}100%{opacity:.15}}
 .s5{animation:fadein 6s ease-out infinite;animation-name:f5}@keyframes f5{0%,64%{opacity:.15}72%,92%{opacity:1}100%{opacity:.15}}
 .a0{animation:p0 6s ease-in-out infinite}@keyframes p0{0%,8%,18%,100%{stroke:#8a8f98;stroke-width:3}13%{stroke:#e8a33d;stroke-width:5}}
 .a1{animation:p1 6s ease-in-out infinite}@keyframes p1{0%,20%,30%,100%{stroke:#8a8f98;stroke-width:3}25%{stroke:#e8a33d;stroke-width:5}}
 .a2{animation:p2 6s ease-in-out infinite}@keyframes p2{0%,32%,42%,100%{stroke:#8a8f98;stroke-width:3}37%{stroke:#e8a33d;stroke-width:5}}
 .a3{animation:p3 6s ease-in-out infinite}@keyframes p3{0%,44%,54%,100%{stroke:#8a8f98;stroke-width:3}49%{stroke:#e8a33d;stroke-width:5}}
 .a4{animation:p4 6s ease-in-out infinite}@keyframes p4{0%,56%,66%,100%{stroke:#8a8f98;stroke-width:3}61%{stroke:#e8a33d;stroke-width:5}}
}
@media (prefers-reduced-motion: reduce){ .rm-hide{display:none} }
</style>
<rect width="800" height="860" fill="#ffffff"/>
<text x="32" y="48" font-size="26" font-weight="700" fill="#1d2433">From well to rack: where the megawatts go</text>
<text x="32" y="74" font-size="15" fill="#8a8f98">Archegon · illustrative concept, not to scale · not an engineering design</text>
<text class="st s0" x="32" y="132.0" font-size="17" font-weight="700" fill="#1d2433" text-anchor="start">Underground heat</text><rect class="st s0" x="250" y="110" width="500" height="56" rx="8" fill="#fff" stroke="#7a3b52" stroke-width="2" stroke-dasharray="6 5"/><text class="st s0" x="262" y="134.0" font-size="15" font-weight="600" fill="#7a3b52" text-anchor="start">Thermal input</text><text class="st s0" x="262" y="153.5" font-size="15" font-weight="600" fill="#7a3b52" text-anchor="start">not modelled</text><polyline class="ar a0" points="140,170 140,196" fill="none" stroke="#8a8f98" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text class="st s1" x="32" y="227.0" font-size="17" font-weight="700" fill="#1d2433" text-anchor="start">Well capacity</text><rect class="st s1" x="250" y="205" width="500.0" height="56" rx="8" fill="#d1495b" stroke="#d1495b" stroke-width="2"/><text class="st s1" x="262" y="229.0" font-size="15" font-weight="600" fill="#fff" text-anchor="start">2 producers × 5 MWe net</text><text class="st s1" x="262" y="248.5" font-size="15" font-weight="600" fill="#fff" text-anchor="start">= 10 MWe net (base)</text><polyline class="ar a1" points="140,265 140,291" fill="none" stroke="#8a8f98" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text class="st s2" x="32" y="322.0" font-size="17" font-weight="700" fill="#1d2433" text-anchor="start">Net capacity needed</text><rect class="st s2" x="250" y="300" width="347.0" height="56" rx="8" fill="#e8a33d" stroke="#e8a33d" stroke-width="2"/><text class="st s2" x="262" y="324.0" font-size="15" font-weight="600" fill="#fff" text-anchor="start">6.94 MW net</text><polyline class="ar a2" points="140,360 140,386" fill="none" stroke="#8a8f98" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text class="st s3" x="32" y="417.0" font-size="17" font-weight="700" fill="#1d2433" text-anchor="start">Average at fence</text><rect class="st s3" x="250" y="395" width="312.5" height="56" rx="8" fill="#c98a2b" stroke="#c98a2b" stroke-width="2"/><text class="st s3" x="262" y="419.0" font-size="15" font-weight="600" fill="#fff" text-anchor="start">6.25 MW average, not firm</text><text class="st s3" x="262" y="438.5" font-size="15" font-weight="600" fill="#fff" text-anchor="start">(× 0.90 capacity factor)</text><polyline class="ar a3" points="140,455 140,481" fill="none" stroke="#8a8f98" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text class="st s4" x="32" y="512.0" font-size="17" font-weight="700" fill="#1d2433" text-anchor="start">IT load</text><rect class="st s4" x="250" y="490" width="250.0" height="56" rx="8" fill="#0b6b5c" stroke="#0b6b5c" stroke-width="2"/><text class="st s4" x="262" y="514.0" font-size="15" font-weight="600" fill="#fff" text-anchor="start">5.0 MW</text><text class="st s4" x="262" y="533.5" font-size="15" font-weight="600" fill="#fff" text-anchor="start">(÷ PUE 1.25)</text><polyline class="ar a4" points="140,550 140,576" fill="none" stroke="#8a8f98" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text class="st s5" x="32" y="607.0" font-size="17" font-weight="700" fill="#1d2433" text-anchor="start">Racks</text><rect class="st s5" x="250" y="585" width="500" height="56" rx="8" fill="#fff" stroke="#1d2433" stroke-width="2" stroke-dasharray="6 5"/><text class="st s5" x="262" y="609.0" font-size="15" font-weight="600" fill="#1d2433" text-anchor="start">~38 GB200-class</text><text class="st s5" x="262" y="628.5" font-size="15" font-weight="600" fill="#1d2433" text-anchor="start">(130 kW each)</text><rect x="32" y="685" width="736" height="132" rx="10" fill="#eef4f2" stroke="#0b6b5c" stroke-width="2"/><text x="48" y="712.0" font-size="16" font-weight="700" fill="#0b6b5c" text-anchor="start">What is not yet in the chain</text><text x="48" y="736.0" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">• Parasitic load not modelled; well ratings are taken as net.</text><text x="48" y="754.2" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">• 6.25 MW is an average; firm supply for IT needs backup or grid import.</text><text x="48" y="772.4" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">• PUE 1.25 is an assumption; a 1.48 survey average would cut IT to ~4.2 MW.</text><text x="48" y="790.6" font-size="14" font-weight="400" fill="#1d2433" text-anchor="start">• Thermal input and well flow rate are not modelled.</text>
<text x="32" y="840" font-size="12.5" fill="#8a8f98">Illustrative - not to scale except bars (against 10 MWe net). Public-benchmark example; not an offer.</text>
<g aria-hidden="true"></g>
</svg>